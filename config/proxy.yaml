proxy:
  # Stable identity reported to the control plane
  id: "proxy-1"
  version: "1.0.0"

  # The port this proxy listens on
  listen_port: 8000
  advertise_addr: "localhost:8000"

  # The backend service to forward requests to
  # This remains the active route source until dynamic config wiring is implemented
  backend:
    host: "localhost"
    port: 3000

  # Timeout settings
  timeout:
    # How long to wait for backend response
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s

control_plane:
  # Mandatory bootstrap address for control plane registration and config streaming
  address: "localhost:9090"
